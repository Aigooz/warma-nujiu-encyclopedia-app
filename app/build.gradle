plugins {
    id 'com.android.application'
}

// 签名口令不再硬编码在源码里。优先级：环境变量（CI）> local.properties（本地，已被 .gitignore 忽略）。
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def releaseKeystorePath = System.getenv("ANDROID_UPLOAD_KEYSTORE")
        ?: localProps.getProperty("keystore.path")
        ?: rootProject.file("upload-keystore.jks").absolutePath
def releaseKeystorePassword = System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
        ?: localProps.getProperty("keystore.password")
def releaseKeyAlias = System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
        ?: localProps.getProperty("keystore.alias")
        ?: "encyclopedia"

android {
    namespace 'com.aigooz.encyclopediaapp'
    compileSdk 34

    signingConfigs {
        release {
            // 注意：这里不能直接 throw。signingConfigs 在**配置阶段**就会被求值，
            // 而 testDebugUnitTest / lintDebug 等任务并不需要签名口令；
            // 若在此处抛异常，这些任务同样会失败。因此缺失时留空，
            // 由下面的 release 变体在真正打包时再校验。
            if (releaseKeystorePassword != null && !releaseKeystorePassword.trim().isEmpty()) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeystorePassword
            }
        }
    }

    defaultConfig {
        applicationId "com.aigooz.encyclopediaapp"
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName "1.6.1"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // R8 代码压缩 + 资源压缩。必须配合 proguard-rules.pro 中的 Gson keep 规则，
            // 否则字段被重命名会导致数据解析全空（详见该文件注释）。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin', 'kotlin-tooling-metadata.json']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}

// 只在真正要打包 release 时才校验签名口令，避免影响测试与 lint 任务。
tasks.matching { it.name.equals("packageRelease") }.configureEach {
    doFirst {
        if (releaseKeystorePassword == null || releaseKeystorePassword.trim().isEmpty()) {
            throw new GradleException(
                    "缺少签名口令，无法打包 release。请设置环境变量 ANDROID_UPLOAD_KEYSTORE_PASSWORD，" +
                    "或在 local.properties 中配置 keystore.password（该文件不会被提交）。")
        }
    }
}
