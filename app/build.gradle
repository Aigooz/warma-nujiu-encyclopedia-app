plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aigooz.encyclopediaapp'
    compileSdk 34

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_UPLOAD_KEYSTORE") ?: rootProject.file("upload-keystore.jks").absolutePath
            def keystorePassword = System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD") ?: "encyclopedia"
            def keyAliasName = System.getenv("ANDROID_UPLOAD_KEY_ALIAS") ?: "encyclopedia"
            storeFile file(keystorePath)
            storePassword keystorePassword
            keyAlias keyAliasName
            keyPassword keystorePassword
        }
    }

    defaultConfig {
        applicationId "com.aigooz.encyclopediaapp"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.1.1"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
